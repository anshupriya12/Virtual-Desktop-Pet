[Rainmeter]
Update=500
AccurateText=1

[Metadata]
Name=Virtual Desktop Pet Settings - Version 1
Author=Virtual Desktop Pet Community
Information=Settings widget for Virtual Desktop Pet (Version 1). Customize your name, choose between Penguin, Doggo, and Catu, tune pet size and reminder intervals.
Version=1
License=Creative Commons

[Variables]
@IncludeSettings=#@#Settings.inc

; ---------------------------------------------------------------------
; Shared styles (letter spacing is done by Substitute inserting thin spaces)
; ---------------------------------------------------------------------
[StyleLabel]
FontFace=Fredoka SemiBold
FontSize=9
FontColor=160,175,200,255
AntiAlias=1
DynamicVariables=1
RegExpSubstitute=1
Substitute="(\S)(?=\S)":"\1 "

[StyleBtnText]
FontFace=Fredoka SemiBold
FontSize=9
StringAlign=CenterCenter
AntiAlias=1
DynamicVariables=1
RegExpSubstitute=1
Substitute="(\S)(?=\S)":"\1 "

; ---------------------------------------------------------------------
; Name input (InputText plugin)
; ---------------------------------------------------------------------
[MeasureInputName]
Measure=Plugin
Plugin=InputText
X=24
Y=94
W=272
H=30
SolidColor=25,30,42,255
FontColor=255,255,255,255
FontFace=Fredoka SemiBold
FontSize=11
StringAlign=Left
DefaultValue=#UserName#
FocusDismiss=1
Command1=[!CommandMeasure "MeasurePet" "SetUserName([[$UserInput$]])" "#ROOTCONFIG#"]

; ---------------------------------------------------------------------
; Background panel (right-click anywhere to unload)
; ---------------------------------------------------------------------
[MeterSettingsBG]
Meter=Image
ImageName=#@#Images\UI\settings_bg.png
X=0
Y=0
W=320
H=440

[MeterTitle]
Meter=String
MeterStyle=StyleLabel
Text=Pet Settings
FontSize=14
FontColor=255,255,255,255
X=20
Y=18

[MeterVersion]
Meter=String
MeterStyle=StyleLabel
Text=Version 1
FontSize=8
FontColor=130,145,170,255
StringAlign=Right
X=300
Y=24

; ---------------------------------------------------------------------
; Section 1: Your name
; ---------------------------------------------------------------------
[MeterLabelName]
Meter=String
MeterStyle=StyleLabel
Text=YOUR NAME (Click to edit):
X=20
Y=68

[MeterNameBoxShape]
Meter=Shape
Shape=Rectangle 0,0,280,34,8 | Fill Color 255,255,255,10 | StrokeWidth 1 | Stroke Color 255,255,255,140
X=20
Y=88
LeftMouseUpAction=[!CommandMeasure "MeasureInputName" "ExecuteBatch 1"]

[MeterNameDisplay]
Meter=String
MeterStyle=StyleLabel
Text=#UserName#
FontSize=11
FontColor=255,255,255,255
X=32
Y=95
LeftMouseUpAction=[!CommandMeasure "MeasureInputName" "ExecuteBatch 1"]

; ---------------------------------------------------------------------
; Section 2: Choose your pet (full sprite previews, nothing cropped)
; ---------------------------------------------------------------------
[MeterLabelPet]
Meter=String
MeterStyle=StyleLabel
Text=CHOOSE YOUR PET:
X=20
Y=134
[MeasureCardPenguin]
Measure=String
String=#PetType#
DynamicVariables=1
RegExpSubstitute=1
Substitute="^Penguin$":"255","^(Doggo|Catu)$":"140"

[MeterCardPenguinBG]
Meter=Shape
Shape=Rectangle 0,0,88,84,8 | Fill Color 255,255,255,10 | StrokeWidth 1 | Stroke Color 255,255,255,[MeasureCardPenguin]
DynamicVariables=1
X=20
Y=154
LeftMouseUpAction=[!SetVariable PetType "Penguin"][!SetVariable PetType "Penguin" "#ROOTCONFIG#"][!CommandMeasure "MeasurePet" "ApplySettings()" "#ROOTCONFIG#"][!UpdateMeasure *][!UpdateMeter *][!Redraw]

[MeterCardPenguinImg]
Meter=Image
ImageName=#@#Images\Pets\Penguin\idle_1.png
X=32
Y=160
W=64
H=58
PreserveAspectRatio=1
LeftMouseUpAction=[!SetVariable PetType "Penguin"][!SetVariable PetType "Penguin" "#ROOTCONFIG#"][!CommandMeasure "MeasurePet" "ApplySettings()" "#ROOTCONFIG#"][!UpdateMeasure *][!UpdateMeter *][!Redraw]

[MeterCardPenguinText]
Meter=String
MeterStyle=StyleLabel
Text=Penguin
FontColor=240,244,250,255
StringAlign=Center
X=64
Y=221
LeftMouseUpAction=[!SetVariable PetType "Penguin"][!SetVariable PetType "Penguin" "#ROOTCONFIG#"][!CommandMeasure "MeasurePet" "ApplySettings()" "#ROOTCONFIG#"][!UpdateMeasure *][!UpdateMeter *][!Redraw]

[MeasureCardDoggo]
