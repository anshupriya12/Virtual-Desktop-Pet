[Rainmeter]
Update=66
AccurateText=1
ContextTitle1=Show a reminder now
ContextAction1=[!CommandMeasure "MeasurePet" "ForceAdvice()"]
ContextTitle2=Toggle Sleep Mode
ContextAction2=[!CommandMeasure "MeasurePet" "ToggleSleep()"]
ContextTitle3=Pet Settings
ContextAction3=[!ActivateSkin "#ROOTCONFIG#\Settings" "Settings.ini"]
ContextTitle4=Size: Default (55%)
ContextAction4=[!CommandMeasure "MeasurePet" "SetScale(0.55)"]
ContextTitle5=Switch Pet -> Penguin
ContextAction5=[!CommandMeasure "MeasurePet" "SwitchPet('Penguin')"]
ContextTitle6=Switch Pet -> Doggo
ContextAction6=[!CommandMeasure "MeasurePet" "SwitchPet('Doggo')"]
ContextTitle7=Switch Pet -> Catu
ContextAction7=[!CommandMeasure "MeasurePet" "SwitchPet('Catu')"]

[Metadata]
Name=Virtual Desktop Pet - Version 1
Author=Virtual Desktop Pet Community
Information=Virtual Desktop Pet (Version 1): an adorable animated desktop pet companion that breathes, blinks, naps with drifting Zzzs, wakes up, and reminds you to stay healthy. Scroll up/down over the pet to resize!
Version=1
License=Creative Commons

; ---------------------------------------------------------------------
; User settings loaded from @Resources\Settings.inc
; ---------------------------------------------------------------------
[Variables]
@IncludeSettings=#@#Settings.inc
CurrentFrame=idle_1.png
AdviceTag=WELLNESS
AdviceText=
BubbleHidden=1
BreathX=1
BreathY=1
PetAngle=0
HopY=0

; ---------------------------------------------------------------------
; Pet logic: idle breathing, blinking, sleeping Zzz, waking up, reminders
; ---------------------------------------------------------------------
[MeasurePet]
Measure=Script
ScriptFile=#@#Scripts\PetController.lua
UpdateDivider=1

; ---------------------------------------------------------------------
; Speech bubble (hidden during idle; shown during reminders).
; Its left edge never goes below X=10, so it is never clipped.
; ---------------------------------------------------------------------
[MeterBubbleBG]
Meter=Image
ImageName=#@#Images\UI\bubble_bg.png
DynamicVariables=1
X=([MeterPet:X] + ([MeterPet:W] / 2) - 135)
Y=2
W=270
H=86
Hidden=#BubbleHidden#
Group=Bubble

[MeterBubbleTag]
Meter=String
Text=#AdviceTag#
DynamicVariables=1
FontFace=Fredoka SemiBold
FontSize=9
FontColor=130,200,255,255
StringAlign=Center
AntiAlias=1
RegExpSubstitute=1
Substitute="(\S)(?=\S)":"\1 "
X=([MeterBubbleBG:X] + 135)
Y=14
W=250
H=16
Hidden=#BubbleHidden#
Group=Bubble

[MeterBubbleText]
Meter=String
Text=#AdviceText#
DynamicVariables=1
FontFace=Fredoka SemiBold
FontSize=10
FontColor=245,248,252,255
StringAlign=Center
AntiAlias=1
ClipString=2
RegExpSubstitute=1
Substitute="(\S)(?=\S)":"\1 "
X=([MeterBubbleBG:X] + 135)
Y=30
W=245
H=44
Hidden=#BubbleHidden#
Group=Bubble

; ---------------------------------------------------------------------
; The pet sprite
; - Click on awake pet: happy reaction
; - Click on sleeping pet: wake-up animation
; - Scroll up / down: resize
; - Drag anywhere on the pet: move around the desktop
; The pet is centred under the bubble when small (X never below 10).
; ---------------------------------------------------------------------
[MeterPet]
Meter=Image
ImageName=#@#Images\Pets\#PetType#\#CurrentFrame#
DynamicVariables=1
X=(Max(10, 145 - 420 * #PetScale# / 2) + 420 * #PetScale# * (1 - #BreathX#) / 2)
Y=(90 + 380 * #PetScale# * (1 - #BreathY#) - #HopY#)
W=(420 * #PetScale# * #BreathX#)
H=(380 * #PetScale# * #BreathY#)
PreserveAspectRatio=0
ImageRotate=#PetAngle#
MouseOverAction=[!CommandMeasure "MeasurePet" "Interact()"]
LeftMouseUpAction=[!CommandMeasure "MeasurePet" "PetClicked()"]
MouseScrollUpAction=[!CommandMeasure "MeasurePet" "ScaleUp()"]
MouseScrollDownAction=[!CommandMeasure "MeasurePet" "ScaleDown()"]

; ---------------------------------------------------------------------
; Sleep moon icon (pinned to pet's bottom-right; only visible while awake).
; Settings are opened from the right-click menu.
; ---------------------------------------------------------------------
[MeterSleepIcon]
Meter=Image
ImageName=#@#Images\UI\icon_sleep.png
DynamicVariables=1
X=([MeterPet:X] + [MeterPet:W] - 24)
Y=([MeterPet:Y] + [MeterPet:H] - 22)
W=20
H=20
Hidden=#SleepMode#
LeftMouseUpAction=[!CommandMeasure "MeasurePet" "ToggleSleep()"]
Group=Controls